name: Visual Regression Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate snapshots and upload them as an artifact"
        type: boolean
        default: false

jobs:
  visual-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Enable corepack (pnpm pinned via packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # a warm pnpm store skips puppeteer's postinstall, so the browser
      # download must be explicit
      - name: Install Chrome for puppeteer
        run: pnpm exec puppeteer browsers install chrome

      - name: Build Butterchurn
        run: pnpm dev-build

      - name: Run visual regression tests
        if: ${{ !inputs.update_snapshots }}
        run: pnpm test:visual

      - name: Regenerate snapshots
        if: ${{ inputs.update_snapshots }}
        run: pnpm test:visual:update

      - name: Upload regenerated snapshots
        # an `if` without a status function implies success(), which threw away
        # snapshots that had already been written when a later assertion failed
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updated-snapshots
          path: test/visual/__image_snapshots__/*.png
          retention-days: 7

      - name: Upload failed snapshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-snapshots
          path: |
            test/visual/__image_snapshots__/__diff_output__/
            test/visual/__image_snapshots__/*-diff.png
          retention-days: 7
