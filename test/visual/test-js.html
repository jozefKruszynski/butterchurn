<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }
      #canvas {
        display: block;
      }
    </style>

    <script type="text/javascript" src="/node_modules/butterchurn-presets-js/lib/butterchurnPresets.min.js"></script>

    <script type="module">
      import butterchurn from '/dist/butterchurn.js';

      document.addEventListener("DOMContentLoaded", function() {
        window.startVisualization = async function(params) {
          const { width, height, presetName, audioData, frames, seed,
                  blendPresetName, blendTime, blendFrames } = params;

          const canvas = document.getElementById('canvas');
          canvas.width = width;
          canvas.height = height;

          const visualizer = butterchurn.createVisualizer(null, canvas, {
            width: width,
            height: height,
            deterministic: true,
            seed: seed
          });

          const presets = butterchurnPresets.getPresets();

          const preset = presets[presetName];
          if (preset) {
            await visualizer.loadPreset(preset, 0);
          } else {
            throw new Error('Preset not found: ' + presetName);
          }

          window.audioData = audioData;

          let currentFrame = 0;
          let blendLoaded = false;
          const totalFrames = frames + (blendPresetName ? blendFrames : 0);
          window.renderComplete = false;

          function render() {
            if (currentFrame >= totalFrames) {
              window.renderComplete = true;
              return;
            }
            if (blendPresetName && currentFrame === frames && !blendLoaded) {
              blendLoaded = true;
              const blendPreset = presets[blendPresetName];
              if (!blendPreset) {
                throw new Error('Blend preset not found: ' + blendPresetName);
              }
              // mid-blend frames are the point: keep rendering while blending
              visualizer.loadPreset(blendPreset, blendTime).then(() => render());
              return;
            }

            const audio = window.audioData[currentFrame];
            const elapsedTime = currentFrame === 0
              ? audio.time
              : audio.time - window.audioData[currentFrame - 1].time;

            visualizer.render({
              elapsedTime,
              audioLevels: {
                timeByteArray: audio.timeByteArray,
                timeByteArrayL: audio.timeByteArrayL,
                timeByteArrayR: audio.timeByteArrayR,
              }
            });

            currentFrame++;
            requestAnimationFrame(render);
          }

          render();
        };
      });
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
  </body>
</html>
